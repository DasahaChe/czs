<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Водные блики</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        .water-background {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #0537c8;
            overflow: hidden;
        }
        
        /* Общие стили для бликов */
        .water-background:before,
        .water-background:after,
        .shine {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.4;
            mix-blend-mode: screen;
        }
        
        /* Первый слой бликов */
        .water-background:before {
            background: radial-gradient(circle at 30% 20%, #E6F4FF 0%, transparent 25%),
                        radial-gradient(circle at 70% 60%, #7DB3E3 0%, transparent 25%),
                        radial-gradient(circle at 40% 80%, #5bc5f2 0%, transparent 30%);
            animation: waterShine 15s linear infinite;
        }
        
        /* Второй слой бликов */
        .water-background:after {
            background: radial-gradient(circle at 60% 10%, #5bc5f2 0%, transparent 20%),
                        radial-gradient(circle at 20% 70%, #E6F4FF 0%, transparent 30%),
                        radial-gradient(circle at 80% 40%, #7DB3E3 0%, transparent 25%);
            animation: waterShine 20s linear infinite reverse;
        }
        
        /* Дополнительные элементы для бликов */
        .shine:nth-child(1) {
            background: radial-gradient(circle at 50% 30%, #7DB3E3 0%, transparent 35%);
            animation: waterShine 25s linear infinite;
            animation-delay: -5s;
        }
        
        .shine:nth-child(2) {
            background: radial-gradient(circle at 10% 50%, #5bc5f2 0%, transparent 30%),
                        radial-gradient(circle at 90% 80%, #E6F4FF 0%, transparent 25%);
            animation: waterShine 18s linear infinite;
            animation-delay: -10s;
        }
        
        /* Анимация движения бликов */
        @keyframes waterShine {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(-5%, 2%) scale(1.1);
                opacity: 0.4;
            }
            50% {
                transform: translate(2%, 5%) scale(1.05);
                opacity: 0.5;
            }
            75% {
                transform: translate(5%, -2%) scale(1.1);
                opacity: 0.4;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
        }
        
        /* Эффект ряби на воде */
        .ripple {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.1));
            animation: rippleEffect 5s ease-in-out infinite alternate;
        }
        
        @keyframes rippleEffect {
            0% {
                transform: skewX(0deg);
                opacity: 0.1;
            }
            100% {
                transform: skewX(5deg);
                opacity: 0.3;
            }
        }
    </style>
</head>
