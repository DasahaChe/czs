<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Презентация ЦЗС main</title>
    <style>
       
        @font-face {
            font-family: 'TT Fors';
            src: local('TT Fors'), url('../fonts/fors/TT\ Fors\ Trial\ Regular.woff') format('woff'), url('../fonts/TT\ Fors\ Trial\ Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Fors ExtraBold';
            src: local('TT Fors ExtraBold'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff') format('woff'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            width: 297mm;
            height: 210mm;
            position: relative;
            font-family: 'TT Fors', Arial, sans-serif;
        }

        .a4-container {
            width: 297mm;
            height: 210mm;
            position: relative;
            background-image: url('img/fonMain.jpg');
            background-size: contain;
            background-position: top left;
            background-repeat: no-repeat;
        }

        .logo {
            position: absolute;
            top: 10mm;
            left: 10mm;
            width: 87.5mm;
            height: 24.0mm;
        }

        .logo-img {
            width: 87.5mm;
            height: 24.0mm;
        }

        .right-top-container {
            display: table;
            border-collapse: collapse;
            position: absolute;
            top: 10mm;
            right: 10mm;
            height: 24mm;
        }

        .image-box {
            height: 24mm;
            vertical-align: top;
            text-align: center;
            position: relative;
        }

        .name-top {
            position: absolute;
            top: 60mm;
            left: 20mm;
            padding: 2mm 5mm 1.5mm 5mm;
            color: #224e85;
            background-color: #fff;
            border-radius: 5mm;
            font-family: 'TT Fors';
        }

        .name-bottom {
            position: absolute;
            top: 74mm;
            left: 20mm;
            color: #fff;
        }

        .name-text {
            margin: 0;
            padding: 0;            
        }

        .bottom-container {
            position: absolute;
            top: 140mm;
            left: 20mm;
        }

        .description {
            padding: 2mm 5mm;
            color: #224e85;
            background-color: #fff;
            border-radius: 5mm;
            border-collapse: collapse;
           
        }

        .clogan {
            position: absolute;
            top: 100mm;
            left: 20mm;
            width: 160mm;
            font-size: 2.6em;
            line-height: 0.9em;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="a4-container">
        <div class="logo">
            <img class="logo-img" src="img/LogoMain.png" alt="Logo">
        </div>

        <table class="right-top-container">
            <tr>
                <td class="image-box">
                    <img src="img/image1.png" alt="Image 1">
                </td>
                <td class="image-box">
                    <img src="img/image2.png" alt="Image 2">
                </td>
                <td class="image-box">
                    <img src="img/image3.png" alt="Image 3">
                </td>
            </tr>
        </table>

        <div class="name-top">OOO "ВКУСПРОМ"</div>
        <div class="name-bottom">
            <p class="name-text">Генеральныому директору</p>
            <p class="name-text">Лотову Роману Юрьевичу</p>
        </div>
        <div class="clogan">Как получить 5-10 контрактов за 2 дня с розничными сетями</div>

        <div class="bottom-container">
            <span class="description">2 дня</span>
            <span class="description">30-40 переговоров</span>
            <span class="description">категория "Кондитерские изделия"</span>
        </div>
    </div>
</body>

</html>
