<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Презентация ЦЗС main</title>
    <style>
        @font-face {
            font-family: 'TT Fors';
            src: local('TT Fors'), url('../fonts/fors/TT\ Fors\ Trial\ Regular.woff') format('woff'), url('../fonts/TT\ Fors\ Trial\ Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Fors ExtraBold';
            src: local('TT Fors ExtraBold'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff') format('woff'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            width: 297mm;
            height: 210mm;
            position: relative;
            font-family: 'TT Fors', Arial, sans-serif;
            background: linear-gradient(133deg,rgba(26, 91, 175, 1) 2%, rgba(50, 170, 240, 1) 28%, rgba(41, 124, 207, 1) 56%, rgba(44, 139, 205, 1) 78%, rgba(34, 107, 201, 1) 100%);
        }

        .a4-container {
            width: 297mm;
            height: 210mm;
            position: relative;
            padding: 10mm;
            border: 1px solid #000;           
        }

        .logo {
            float: left;
            margin-bottom: 34mm;
            width: 87.5mm;
            height: 24.0mm;
        }

        .logo-img {
            width: 87.5mm;
            height: 24.0mm;
        }

        .logo-line{
            width: 80mm;
        }
        .right-top-container {
            float: right;
            width: 80mm;
            height: 24mm;
        }

        .image-box {
            height: 24mm;
            vertical-align: top;
            text-align: center;
            position: relative;
        }

        .text-block {
            position: relative;
            padding: 10mm;
            width: 160mm;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 7mm;
        }

        .name-top {
            padding: 2mm 5mm 1.5mm 5mm;
            margin-bottom: 10mm;
            color: #224e85;
            background-color: #fff;
            border-radius: 5mm;
            font-family: 'TT Fors';
        }

        .name-bottom {
            color: #fff;
            margin-bottom: 25mm;
        }

        .name-text {
            margin: 0;
            padding: 0;
        }


        .bottom-container {
            text-align: center;

        }

        .description-left {
            float: left;
            width: 12mm;
            padding: 2mm 5mm;
            background-color: #fff;
            border-radius: 5mm;
            vertical-align: middle;
            color: #224e85;
        }

        .description {
            float: left;
            width: 40mm;
            padding: 2mm 5mm;
            background-color: #fff;
            border-radius: 5mm;
            vertical-align: middle;
            color: #224e85;
        }

        .description-right {
            float: left;
            padding: 2mm 5mm;
            background-color: #fff;
            border-radius: 5mm;
            vertical-align: middle;
            color: #224e85;
        }



        .clogan {
            margin-bottom: 25mm;
            font-size: 2.6em;
            line-height: 0.9em;
            color: #fff;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>
    <div class="a4-container">
        <div class="logo">
            <img class="logo-img" src="img/LogoMain.png" alt="Logo">
        </div>

        <div class="right-top-container">            
            <img class="logo-line" src="img/imageLogo.png">
        </div>
        <div class="clear"></div>
        <div class="text-block">
            <div class="name-top">OOO "ВКУСПРОМ"</div>
            <div class="name-bottom">
                <p class="name-text">Генеральныому директору</p>
                <p class="name-text">Лотову Роману Юрьевичу</p>
            </div>
            <div class="clogan">Как получить 5-10 контрактов за 2 дня с розничными сетями</div>

            <div class="bottom-container">
                <div class="description-left">2 дня</div>
                <div class="description">30-40 переговоров</div>
                <div class="description-right">категория "Кондитерские изделия"</div>
            </div>
            <div class="clear"></div>
        </div>

    </div>
</body>

</html>
