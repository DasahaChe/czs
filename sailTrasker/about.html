<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Презентация ЦЗС main</title>
    <style>
        @font-face {
            font-family: 'TT Fors';
            src: local('TT Fors'), url('../fonts/fors/TT\ Fors\ Trial\ Regular.woff') format('woff'), url('../fonts/TT\ Fors\ Trial\ Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Fors ExtraBold';
            src: local('TT Fors ExtraBold'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff') format('woff'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            width: 297mm;
            height: 210mm;
            position: relative;
            font-family: 'TT Fors', Arial, sans-serif;
            background-color: blue;
        }

       .a4-container {
            width: 297mm;
            height: 210mm;
            position: relative;
            padding: 10mm;
            background-image: url('img/fonMain.jpg');
            background-size: contain;
            background-position: top left;
            background-repeat: no-repeat;
        }

        .logo {
            float: left;
            clear: right;
            margin-top: 10mm;
            margin-left: 10mm;
            width: 87.5mm;
            height: 24.0mm;
        }

        .logo-img {
            width: 87.5mm;
            height: 24.0mm;
        }

        .right-top-container {
            float: right;
            clear: right;
            height: 24mm;
        }

        .top-text {
            font-size: 3.0em;
            font-weight: 600;
            background: linear-gradient(45deg, #1a4ea4, #33bbef);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .menu-list{
            position: absolute;
            top: 10mm;
            left: 10mm;
        }
    </style>
</head>

<body>
    <div class="a4-page">
        <div class="logo">
            <img class="logo-img" src="img/LogoSmall.png" alt="Logo">
        </div>

        <div class="right-top-container">
            <span class="top-number"></span>
            <span class="top-text">Мы работаем для Вас</span>
        </div>
<ul class="menu-list">
    <li class="menu-item-main"><img class="menu-img" src="img/l1-m.svg">О нас
    </li>
    <li class="menu-item"><img class="menu-img" src="img/l2.svg">Переговоры
    </li>
    <li class="menu-item"><img class="menu-img" src="img/l3.svg">Статистика
    </li>
    <li class="menu-item"><img class="menu-img" src="img/l4.svg">Почему мы?
    </li>
    <li class="menu-item"><img class="menu-img" src="img/l5.svg">Как заключить контракт
    </li>
    <li class="menu-item"><img class="menu-img" src="img/l6.svg">Выставка World Food 2025
    </li>
    <li class="menu-item"><img class="menu-img" src="img/l7.svg">Отзывы
    </li>
    <li class="menu-item"><img class="menu-img" src="img/l8.svg">Контакты
    </li>
</ul>

    </div>
</body>

</html>
