<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Презентация ЦЗС main</title>
    <style>
        @font-face {
            font-family: 'TT Fors';
            src: local('TT Fors'), url('../fonts/fors/TT\ Fors\ Trial\ Regular.woff') format('woff'), url('../fonts/TT\ Fors\ Trial\ Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Fors ExtraBold';
            src: local('TT Fors ExtraBold'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff') format('woff'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            width: 297mm;
            height: 210mm;
            position: relative;
            font-family: 'TT Fors', Arial, sans-serif;
            background-color: blue;
        }

        .a4-page {
            width: 297mm;
            height: 210mm;
            position: relative;
            padding: 10mm;
            background-image: url('img/fonPage.jpg');
            background-size: contain;
            background-position: top left;
            background-repeat: no-repeat;
        }

        .logo-about {
            float: left;
            width: 90mm;
            height: 24.0mm;
        }

        .logoAb-img {
            width: 70mm;
        }

        .title-container {
            float: left;
            height: 24mm;
        }

        .title-ab {
            font-size: 3.0em;
            font-weight: 600;
            background: linear-gradient(45deg, #1a4ea4, #33bbef);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .menu-list {
            float: left;
            width: 70mm;
            list-style: none;
        }

        .menu-img {
            width: 10mm;
        }

        .menu-item-main {
            height: 17mm;
            color: #1a4ea4;
            background-image: url(img/listFon.png);
            background-size: contain;
        }

        .menu-item {
            height: 12mm;
            color: #9ccaee;
        }

        .about-block {
            float: left;
            width: 70%;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="a4-page">
        <div class="logo-about">
            <img class="logoAb-img" src="img/LogoSmall.png" alt="Logo">
        </div>

        <div class="title-container">

            <div class="title-ab">Мы работаем для Вас</div>
        </div>
        <div class="clear"></div>
        <ul class="menu-list">
            <li class="menu-item-main"><img class="menu-img" src="img/l1-m.png"><span class="text-menu">О нас</span>
            </li>
            <li class="menu-item"><img class="menu-img" src="img/l2.png">Переговоры
            </li>
            <li class="menu-item"><img class="menu-img" src="img/l3.png">Статистика
            </li>
            <li class="menu-item"><img class="menu-img" src="img/l4.png">Почему мы?
            </li>
            <li class="menu-item"><img class="menu-img" src="img/l5.png">Как заключить контракт
            </li>
            <li class="menu-item"><img class="menu-img" src="img/l6.png">Выставка World Food 2025
            </li>
            <li class="menu-item"><img class="menu-img" src="img/l7.png">Отзывы
            </li>
            <li class="menu-item"><img class="menu-img" src="img/l8.png">Контакты
            </li>
        </ul>
        <div class="about-block"></div>
    </div>
</body>

</html>
