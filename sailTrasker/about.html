<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Презентация ЦЗС about</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 297mm;
            height: 210mm;
            position: relative;
            font-family: Arial, sans-serif;
        }

        .a4-container {
            width: 297mm;
            height: 210mm;
            position: relative;
            background-image: url('fonAbout.jpg');
            background-size: contain;
            background-position: top left;
            background-repeat: no-repeat;
        }

        .logo {
            position: absolute;
            top: 10mm;
            left: 10mm;
            width: 87.5mm;
            height: 24.0mm;
            /* border: 2px solid black; */
        }

        .logo-img {
            width: 87.5mm;
            height: 24.0mm;
        }

        .right-top-container {
            display: table;
            border-collapse: collapse;
            position: absolute;
            top: 10mm;
            right: 10mm;
            height: 24mm;
            /* border: 2px solid black; */
        }

        .image-box {
            height: 24mm;
            vertical-align: top;
            text-align: center;
            position: relative;
            /* border: 1px solid #c93939; */
        }

        .name-top {
            position: absolute;
            top: 60mm;
            left: 20mm;
            padding: 2mm 5mm 1.5mm 5mm;
            color: #224e85;
            background-color: #fff;
            border-radius: 5mm;
        }

        .name-bottom {
            position: absolute;
            top: 70mm;
            left: 20mm;
            color: #fff;
            /* border: 2px solid black; */
        }

        .name-text {
            margin: 0;
            padding: 0;
            margin-bottom: 3mm;
        }

        .bottom-container {
            position: absolute;
            top: 140mm;
            left: 20mm;
        }

        .description {
            padding: 2mm 5mm;
            color: #224e85;
            background-color: #fff;
            border-radius: 5mm;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div class="a4-container">
        <div class="logo">
            <img class="logo-img" src="LogoMain.png" alt="Logo">
        </div>

        <table class="right-top-container">
            <tr>
                <td class="image-box">
                    <img src="image1.png" alt="Image 1">
                </td>
                <td class="image-box">
                    <img src="image2.png" alt="Image 2">
                </td>
                <td class="image-box">
                    <img src="image3.png" alt="Image 3">
                </td>
            </tr>
        </table>

        <div class="name-top">OOO "ВКУСПРОМ"</div>
        <div class="name-bottom">
            <p class="name-text">Генеральныому директору</p>
            <p class="name-text">Лотову Роману Юрьевичу</p>
        </div>


        <div class="bottom-container">
            <span class="description">2 дня</span>
            <span class="description">30-40 переговоров</span>
            <span class="description">категория "Кондитерские изделия"</span>
        </div>
    </div>
</body>

</html>
