<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Презентация ЦЗС main</title>
    <style>
        @font-face {
            font-family: 'TT Fors';
            src: local('TT Fors'), url('../fonts/fors/TT\ Fors\ Trial\ Regular.woff') format('woff'), url('../fonts/TT\ Fors\ Trial\ Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Fors ExtraBold';
            src: local('TT Fors ExtraBold'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff') format('woff'), url('../fonts/fors/TT\ Fors\ Trial\ ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            width: 297mm;
            height: 210mm;
            position: relative;
            font-family: 'TT Fors', Arial, sans-serif;
            background: linear-gradient(133deg, rgba(26, 91, 175, 1) 6%, rgba(55, 170, 225, 1) 22%, rgba(50, 170, 240, 1) 32%, rgba(41, 124, 207, 1) 44%, rgba(44, 139, 205, 1) 52%, rgba(34, 107, 201, 1) 64%, rgba(44, 139, 205, 1) 75%, rgba(39, 157, 242, 1) 88%, rgba(12, 94, 194, 1) 99%);
        }

        .a4-page {
            width: 297mm;
            height: 210mm;
            position: relative;
        }

        .logo-about {
            float: left;
            width: 80mm;
            height: 210mm;
            padding: 10mm 0 0 10mm;
        }

        .logoAb-img {
            width: 70mm;
        }

        .title-container {
            float: left;
            width: 207mm;
            height: 210mm;
        }

        .title-ab {
            font-size: 3.0em;
            font-weight: 600;
            background: linear-gradient(45deg, #255ba9, #33bbef);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .menu-list {
            height: 162mm;
            list-style: none;
        }

        .menu-img {
            width: 12mm;
        }

       

        .menu-item {
            height: 6mm;
            padding: 3mm 0 3mm 14mm;
            color: #9ccaee;
        }

         .menu-item-main {
            position: relative;
            margin: 5mm 0;
            background-color: #fff;
            border-top-left-radius: 6mm;
            color: #255ba9;
            border-bottom-left-radius: 6mm;
        }

        .img1-m {
           background: #fff url(img/l1-m.png) no-repeat 5mm 3mm;
        }

.img2 {
           background: url(img/l8.png) no-repeat 5mm 3mm;
        }

        .about-block {
            float: left;
            float: left;
            width: 207mm;
            height: 210mm;
            border-top-left-radius: 7mm;
            border-bottom-left-radius: 7mm;
            background-color: #fff;
        }

        .botom-btn {
            padding: 0 4mm;
            margin-top: auto;
            border: 1px solid #9ccaee;
            color: #9ccaee;
            width: 14mm;
            height: 8mm;
            border-radius: 5mm;
            text-align: center;
        }

        .white {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="a4-page">
        <div class="logo-about">
            <img class="logoAb-img" src="img/LogoMain.png" alt="Logo">
            <ul class="menu-list">
                <li class="menu-item menu-item-main img1-m">О нас
                </li>
                <li class="menu-item img2">Переговоры
                </li>
                <li class="menu-item img2">Статистика
                </li>
                <li class="menu-item img2">Почему мы?
                </li>
                <li class="menu-item img2">Как заключить контракт
                </li>
                <li class="menu-item img2">Выставка World Food 2025
                </li>
                <li class="menu-item img2">Отзывы
                </li>
                <li class="menu-item img2">Контакты
                </li>
            </ul>
            <div class="botom-btn"> <span class="white">2</span>/10 </div>
        </div>

        <div class="about-block">
            <div class="title-container">

                <div class="title-ab">Мы работаем для Вас</div>
            </div>
        </div>
    </div>
</body>

</html>
