<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Презентация ЦЗС about</title>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 297mm;
            height: 210mm;
            position: relative;
            font-family: Arial, sans-serif;
        }

        .a4-container {
            width: 297mm;
            height: 210mm;
            position: relative;
            background-image: url('fonPr.png');
            background-size: contain;
            background-position: top left;
            background-repeat: no-repeat;
        }

        .logo {
            position: absolute;
            top: 10mm;
            left: 10mm;
            width: 87.5mm;
            height: 24.0mm;
            /* border: 2px solid black; */
        }

        .logo-img {
            width: 87.5mm;
            height: 24.0mm;
        }

       
    </style>
</head>

<body>
    <div class="a4-container">
        <div class="logo">
            <img class="logo-img" src="img/LogoSmall.png" alt="Logo">
        </div>


    </div>
</body>

</html>
