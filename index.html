<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/main.css">
    <title>Платформа ЦЗС</title>
</head>

<body>
    <div class="start_page">
        <header class="header">
            <div class="container">
                <div class="header__top">
                    <div class="header__logo">
                        <a href="/" class="header__logo-link">
                            <img class="header__logo-img" src="img/logo/logo-2.svg" alt="logo">
                        </a>
                        <a href="/" class="header__logo-link">
                            <div class="header__logo-brand">
                                <span class="header__logo-description">Платформа</span>
                                <span class="header__logo-name">
                                    Центр закупок сетей™
                                </span>
                            </div>
                        </a>
                    </div>
                    <div class="header__links">
                        <div class="header__tel">
                            <a href="#">+7 000 00 00</a>
                        </div>
                        <ul class="header__list-top list-reset flex">
                            <li class="header__burger">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 34 34"
                                    fill="none">
                                    <path d="M2 12.2354H41" stroke="currentcolor" stroke-width="2"
                                        stroke-linecap="round" />
                                    <path d="M2 22.1177H41" stroke="currentcolor" stroke-width="2"
                                        stroke-linecap="round" />
                                    <path d="M2 32H41" stroke="currentcolor" stroke-width="2" stroke-linecap="round" />
                                    <path d="M2 2H41" stroke="currentcolor" stroke-width="2" stroke-linecap="round" />
                                </svg>
                            </li>
                            <li class="header__burger-close">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 34 34"
                                    fill="none">
                                    <path d="M1 1.29297L33.707 34" stroke="currentcolor" stroke-width="2"
                                        stroke-linecap="round" />
                                    <path d="M1 34L33.707 1.29297" stroke="currentcolor" stroke-width="2"
                                        stroke-linecap="round" />
                                </svg>
                            </li>
                            <li class="header__button">
                                <a href="https://portal.platforma-czs.ru/registration/">Регистрация</a>
                            </li>
                            <li class="header__button">
                                <a href="https://portal.platforma-czs.ru/login/">Вход</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <nav class="header__menu">
                <div class="container">
                <ul class="header__list-menu list-reset flex">
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/">Главная</a>
                    </li>
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/about/">О проекте</a>
                    </li>
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/vendors/">Поставщикам</a>
                    </li>
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/buyers/">Закупщикам</a>
                    </li>
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/calendar/">Календарь мероприятий</a>
                    </li>
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/news/">Новости</a>
                    </li>
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/education/">Обучение</a>
                    </li>
                    <li class="header__link">
                        <a href="https://portal.platforma-czs.ru/partners/">Партнеры</a>
                    </li>
                </ul>
                </div>
            </nav>
        </header>
    </div>
</body>

</html>
