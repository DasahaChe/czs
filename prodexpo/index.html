<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/normalize.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-shopping-bag"></i> Каталог товаров</h1>
            <p class="header-subtitle">Оцените продукты и выберите лучшие</p>
        </header>

        <div id="topPagination">
            <!-- Пагинация будет загружена здесь -->
        </div>

        <div class="products-wrapper">
            <div class="scroll-arrows">
                <div class="scroll-arrow left" id="scrollLeft">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <div class="scroll-arrow right" id="scrollRight">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>

            <div id="productsContainer">
                <!-- Карточки товаров будут загружены здесь -->
            </div>
        </div>
        
        <div id="bottomPagination">
            <!-- Пагинация будет загружена здесь -->
        </div>
        
        <div class="footer">
            <p>© 2026 Система оценки продуктов. Всего товаров в базе: <span id="totalProductsCount">0</span></p>
        </div>
    </div>

    <script src="product-card-script.js"></script>
</body>
</html>
