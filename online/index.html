  <style>
    .SmartCaptcha-Overlay {
      position: fixed;
      z-index: 9999999;
      top: -10000px;
      left: -10000px;

      width: 100%;
      width: var(--smart-captcha-doc-width, 100%);
      height: 100%;
      height: var(--smart-captcha-doc-height, 100%);
      margin: 0;
      padding: 0;

      background: rgba(0, 0, 0, 0.4);
    }

    .SmartCaptcha-Overlay.SmartCaptcha-Overlay_visible {
      position: fixed;
      top: 0;
      left: 0;
    }

    .SmartCaptcha-Overlay.SmartCaptcha-Overlay_no_background {
      background: none;
    }

    .SmartCaptcha-Overlay .SmartCaptcha-Spin {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;

      margin: auto;

      transform: translateY(-50%);
    }
  </style>
  <style>
    .SmartCaptcha-Spin {
      display: none;
      visibility: hidden;

      box-sizing: border-box;

      border: 2px solid transparent;
      border-radius: 50%;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0));
    }

    .SmartCaptcha-Spin::after {
      visibility: hidden;

      content: '\00A0';
    }

    .SmartCaptcha-Overlay_visible.SmartCaptcha-Overlay_show_spinner .SmartCaptcha-Spin {
      display: inline-block;
      visibility: visible;

      width: 50px;
      height: 50px;

      border-top-color: #5282FF;
      border-left-color: #5282FF;

      animation: islands-spin 1s .21s infinite linear;

      backface-visibility: hidden;
    }

    .SmartCaptcha-Overlay_visible.SmartCaptcha-Overlay_show_spinner .SmartCaptcha-Spin {
      border-top-color: var(--spin-view-default-border-color, #5282FF);
      border-left-color: var(--spin-view-default-border-color, #5282FF);
    }

    @keyframes islands-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <style>
    .smart-captcha {
      min-width: 300px;
      height: 102px;
    }

    .smart-captcha_invisible {
      height: 0;
    }
  </style>
  <link rel="prefetch" as="script" href="https://smartcaptcha.yandexcloud.net/shield.a7a8aae3ab898b70eed0.chunk.js">
</head>

<body>

  <div class="login-page">
    <div class="login-form">

          <div class="options-list">

            <div class="option">Zh<img src="images/flags/zh.png" alt="Китайский"></div>
            <div class="option">Tr<img src="images/flags/tr.png" alt="Турецкий"></div>
            <div class="option">Fa<img src="images/flags/fa.png" alt="Фарси"></div>
            <div class="option">Hu<img src="images/flags/hu.png" alt="Венгерский"></div>
            <div class="option">Uz<img src="images/flags/uz.png" alt="Узбекский"></div>
          </div>
        </div>
         <div class="select-arrow"></div>
      </div>

      <img class="logo-pic" src="/project/webroot/images/logo-2.svg">
      <div class="logo-title" style="margin:0 0 2em 0; text-align:center;">Авторизуйтесь</div>
      <form action="" method="post">

        <input type="hidden" name="ref" value="" placeholder="Логин">
        <input type="text" name="login" value="" placeholder="Логин">
        <input type="password" name="password" value="" placeholder="Пароль">
        <div style="height: 102px;" id="captcha-container" class="smart-captcha"
          data-sitekey="ysc1_eWoqKgMTlI44a6f8hgMPHlgxkJaOS258yhbBZfIba496edc6" data-testid="smartCaptcha-container">
          <div style="display: none;"><iframe frameborder="0"
              src="https://smartcaptcha.yandexcloud.net/backend.636bb879d1085041bc19.html?sitekey=ysc1_eWoqKgMTlI44a6f8hgMPHlgxkJaOS258yhbBZfIba496edc6&amp;theme=light&amp;hl=ru&amp;host=online-czs.ru&amp;href=https%3A%2F%2Fonline-czs.ru%2F&amp;test=false&amp;webview=false&amp;hideChallengeContainer=false"
              aria-hidden="true" allow="encrypted-media *;" data-testid="backend-iframe" title="SmartCaptcha backend"
              style="display: block; width: 100%; height: 100%; z-index: 0; transform: translate3d(0px, 0px, 0px);"></iframe>
          </div><input type="hidden" name="smart-token" data-testid="smart-token"><iframe frameborder="0"
            src="https://smartcaptcha.yandexcloud.net/checkbox.ru.4fdec4f0c66230612adf.html?sitekey=ysc1_eWoqKgMTlI44a6f8hgMPHlgxkJaOS258yhbBZfIba496edc6&amp;theme=light&amp;hl=ru&amp;host=online-czs.ru&amp;href=https%3A%2F%2Fonline-czs.ru%2F&amp;test=false&amp;webview=false&amp;hideChallengeContainer=false"
            aria-hidden="false" allow="encrypted-media *;"
            style="display: block; width: 100%; height: 100%; z-index: 0; transform: translate3d(0px, 0px, 0px);"
            data-testid="checkbox-iframe" title="SmartCaptcha checkbox widget"></iframe>
        </div>
        <button type="submit" class="btn">Войти</button>

      </form>
    </div>
    <div class="video-box">
      <video loop="" muted="" autoplay="">
        <source src="/project/webroot/video/main.mp4" type="video/mp4">&gt;
      </video>
    </div>
  </div>


  <div class="SmartCaptcha-Overlay SmartCaptcha-Overlay_show_spinner" data-testid="advanced-container" tabindex="-1"
    style="--smart-captcha-doc-height: 135px; --smart-captcha-doc-width: 1880px;">
    <div class="SmartCaptcha-Spin"></div>
  </div>
